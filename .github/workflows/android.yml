name: Android app · build and verify
on:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: books
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: books_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://books:ci-only-password@localhost:5432/books_test
      TEST_DATABASE_URL: postgresql://books:ci-only-password@localhost:5432/books_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: android-app/backend/package-lock.json}
      - run: npm ci
        working-directory: android-app/backend
      - run: npm run migrate && npm test && npm run build:neon
        working-directory: android-app/backend
  apk:
    runs-on: ubuntu-24.04
    env:
      BOOKS_API_URL: ${{ vars.BOOKS_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
        working-directory: android-app
      - name: Verify APK signature and alignment
        run: |
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > apk-compatibility.txt
          cat apk-compatibility.txt
          if grep -q 'testOnly' apk-compatibility.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Nihongo-Path-Books-debug-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android-app/build/website-snapshot/website-source-manifest.json
            android-app/app/build/reports
            android-app/app/build/outputs/androidTest-results
      - name: Decode signing key
        if: ${{ env.SIGNING_KEY != '' }}
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/books-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/books-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release bundle
        if: ${{ env.ANDROID_KEYSTORE_PATH != '' }}
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease
        working-directory: android-app
      - uses: actions/upload-artifact@v4
        if: ${{ env.ANDROID_KEYSTORE_PATH != '' }}
        with:
          name: Nihongo-Path-Books-signed-AAB
          path: android-app/app/build/outputs/bundle/release/*.aab
  device:
    needs: apk
    name: Install and launch · API ${{ matrix.api }} · ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 23, arch: x86, target: default}
          - {api: 29, arch: x86_64, target: google_apis}
          - {api: 33, arch: x86_64, target: google_apis}
          - {api: 35, arch: x86_64, target: google_apis}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: Nihongo-Path-Books-debug-APK
          path: delivered-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          disable-animations: true
          working-directory: android-app
          script: |
            chmod +x gradlew && ./gradlew connectedDebugAndroidTest
            if adb shell pm path online.devnazu.books | grep -q '^package:'; then adb uninstall online.devnazu.books; fi
            adb install ../delivered-apk/app-debug.apk
            adb logcat -c
            adb shell am start -W -n online.devnazu.books/.MainActivity
            sleep 5
            adb shell pidof online.devnazu.books
            adb logcat -d -b crash

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports-api-${{ matrix.api }}-${{ matrix.arch }}
          path: android-app/app/build/reports/androidTests
