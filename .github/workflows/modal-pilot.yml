name: Modal M2M bounded benchmark
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  benchmark:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/bengali-field-inventory-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install modal==1.6.2
      - name: Benchmark eight sentences
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET" || { echo "Modal credentials not configured"; exit 1; }
          python -m modal run scripts/modal_m2m_benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2m-benchmark-unreviewed
          path: m2m-benchmark.jsonl
          if-no-files-found: warn
          retention-days: 7
