name: Modal M2M bounded benchmark (paused)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install modal==1.6.2
      - name: Benchmark eight sentences
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -m modal run scripts/modal_m2m_benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2m-benchmark-unreviewed
          path: m2m-benchmark.jsonl
          if-no-files-found: warn
          retention-days: 7
