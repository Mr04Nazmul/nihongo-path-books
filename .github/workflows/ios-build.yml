name: iOS build
on:
  push:
    branches: ['ios/**']
    paths: ['ios-app/**', '.github/workflows/ios-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios-app
        run: xcodegen generate
      - name: Build iPhone simulator app
        working-directory: ios-app
        run: xcodebuild -project NihongoPath.xcodeproj -scheme NihongoPath -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone archive
        working-directory: ios-app
        run: xcodebuild -project NihongoPath.xcodeproj -scheme NihongoPath -configuration Release -destination 'generic/platform=iOS' -archivePath build/NihongoPath.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - uses: actions/upload-artifact@v4
        with:
          name: NihongoPath-iOS-unsigned
          path: ios-app/build/NihongoPath.xcarchive
